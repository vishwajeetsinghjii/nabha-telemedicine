server {
  listen 80;

  # Doctor verification uploads can contain two documents up to 5 MB each.
  client_max_body_size 20m;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Reverse-proxy versioned API calls to the backend service.
  location /api/v1/ {
    proxy_pass http://backend:5000/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
  location / { try_files $uri $uri/ /index.html; }

  # Auth pages/assets must not be served from an old browser cache after deployment.
  location ~* ^/(?:login|forgot-password|reset-password)\.html$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    try_files $uri =404;
  }
  location ~* ^/js/(?:config|api|auth|login|forgot-password|reset-password)\.js$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    try_files $uri =404;
  }
  location = /health {
    proxy_pass http://backend:5000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
  }
  # Static assets can be cached when versioned; dashboard/auth JS uses explicit query-string versions.
  location ~* \.(?:png|jpg|jpeg|svg|webp|ico|json|woff2)$ { expires 7d; add_header Cache-Control "public, max-age=604800, immutable"; try_files $uri =404; }
  location ~* \.(?:js|css)$ { expires -1; add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always; try_files $uri =404; }
}

