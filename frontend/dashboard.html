<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Router — Nabha Telemedicine</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--background);">
  <div style="text-align: center;">
    <div id="router-state" style="width: 48px; height: 48px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px auto;"></div>
    <h3 id="router-message">Opening your dashboard…</h3><p id="router-error" hidden style="color:var(--danger);margin-top:8px">Unable to open dashboard. <a href="login.html">Return to sign in</a>.</p>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const timer=setTimeout(()=>{document.getElementById('router-error').hidden=false;},8000);
      if (!auth.isAuthenticated()) { clearTimeout(timer);
        window.location.href = 'login.html';
      } else {
        clearTimeout(timer);
        auth.redirectToDashboard();
      }
    });
  </script>
</body>
</html>
