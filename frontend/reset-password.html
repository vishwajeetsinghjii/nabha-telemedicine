<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#006666">
  <link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/accessibility.css"><link rel="stylesheet" href="css/login.css"><link rel="stylesheet" href="css/password-reset.css">
  <title>Set New Password | Nabha Telemedicine</title>
</head>
<body class="login-page">
<header class="login-header"><div class="login-container login-nav"><a href="index.html" class="login-brand" aria-label="Nabha Telemedicine home"><span class="login-brand-mark" aria-hidden="true">⌁</span><span class="login-brand-name">Nabha Telemedicine</span></a><a href="login.html" class="btn btn-outline btn-sm">Sign In</a></div></header>
<main class="login-main"><div class="login-container"><section class="login-card password-card" aria-labelledby="new-password-title">
  <div class="login-card-header"><div class="password-icon" aria-hidden="true">🔒</div><p class="login-eyebrow">SECURE PASSWORD RESET</p><h1 id="new-password-title">Create a new password</h1><p>Choose a strong password for your Nabha Telemedicine account.</p></div>
  <div id="resetMessage" class="login-message" hidden role="alert"></div>
  <form id="resetPasswordForm" novalidate>
    <div class="form-field"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" maxlength="128" required><small class="password-rule">8–128 characters, including uppercase, lowercase, number and special character.</small></div>
    <div class="form-field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" maxlength="128" required><small id="confirmPasswordError" class="field-error" role="alert"></small></div>
    <button id="resetPasswordButton" class="login-submit" type="submit"><span id="resetPasswordText">Update password</span><span id="resetPasswordLoader" hidden>Updating...</span></button>
  </form>
  <div class="password-help"><strong>Already have access?</strong><a href="login.html">Return to sign in</a></div>
</section></div></main>
<footer class="login-footer"><div class="login-container login-footer-content"><span>© 2026 Nabha Telemedicine</span><div class="login-footer-links"><a href="index.html">Home</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></div></div></footer>
<script src="js/config.js?v=3.3.0"></script><script src="js/api.js?v=3.3.0"></script><script src="js/reset-password.js?v=3.3.0"></script><script src="js/app.js"></script>
</body></html>
